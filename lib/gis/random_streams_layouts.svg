<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="sans-serif" font-size="13" fill="#222">
  <title>A single sequence and the whole-span, exact and bounded layouts of six units along the span</title>
  <!-- The end of the span, 2^46 draws after the seed, for all the bars. -->
  <line x1="600" y1="42" x2="600" y2="366" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- A single sequence: one unit which owns the whole span and draws the
       seed's sequence, the values the units of batch 0 of the exact layout
       below draw together. -->
  <text x="80" y="22">a single sequence: G_random_state_from_seed()</text>
  <text x="80" y="38">one unit, which owns the whole span and draws the seed's sequence</text>
  <rect x="80" y="48" width="520" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="80" y="48" width="216" height="24" fill="#222"/>
  <text x="188" y="64.5" text-anchor="middle" fill="#fff">the seed's sequence</text>
  <circle cx="80" cy="60" r="5" fill="#c33"/>
  <text x="70" y="64.5" text-anchor="end">seed</text>
  <!-- The whole span divided into an odd number of equal parts, seven for
       six units, and a stride of a part rounded down to odd; the six units
       take six parts, the last part stays unused, and there is one batch
       only. -->
  <text x="80" y="100">whole-span layout: G_random_init_layout()</text>
  <text x="80" y="116">stride: a part rounded down to odd, seven parts for six units; one batch only</text>
  <rect x="80" y="126" width="520" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="80" y="126" width="14" height="24" fill="#222"/>
  <text x="132" y="142.5" text-anchor="middle">0</text>
  <line x1="154.286" y1="126" x2="154.286" y2="150" stroke="#222" stroke-width="1.5"/>
  <rect x="154.286" y="126" width="22" height="24" fill="#222"/>
  <text x="206.286" y="142.5" text-anchor="middle">1</text>
  <line x1="228.571" y1="126" x2="228.571" y2="150" stroke="#222" stroke-width="1.5"/>
  <rect x="228.571" y="126" width="9" height="24" fill="#222"/>
  <text x="280.571" y="142.5" text-anchor="middle">2</text>
  <line x1="302.857" y1="126" x2="302.857" y2="150" stroke="#222" stroke-width="1.5"/>
  <rect x="302.857" y="126" width="27" height="24" fill="#222"/>
  <text x="354.857" y="142.5" text-anchor="middle">3</text>
  <line x1="377.143" y1="126" x2="377.143" y2="150" stroke="#222" stroke-width="1.5"/>
  <rect x="377.143" y="126" width="19" height="24" fill="#222"/>
  <text x="429.143" y="142.5" text-anchor="middle">4</text>
  <line x1="451.429" y1="126" x2="451.429" y2="150" stroke="#222" stroke-width="1.5"/>
  <rect x="451.429" y="126" width="12" height="24" fill="#222"/>
  <text x="503.429" y="142.5" text-anchor="middle">5</text>
  <line x1="525.714" y1="126" x2="525.714" y2="150" stroke="#222" stroke-width="1.5"/>
  <text x="562.857" y="142.5" text-anchor="middle" fill="#888">unused</text>
  <circle cx="80" cy="138" r="5" fill="#c33"/>
  <text x="70" y="142.5" text-anchor="end">seed</text>
  <path d="M 80 154 L 80 158 L 525.714 158 L 525.714 154" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="302.857" y="174" text-anchor="middle">batch 0, the only batch</text>
  <!-- Exact: a stride of exactly the values a unit draws; batch 0 is the
       seed's sequence and batch 1 the next six units. -->
  <text x="80" y="198">exact layout: G_random_init_layout_exact()</text>
  <text x="80" y="214">stride: the values each unit draws; batch 0 is the seed's sequence</text>
  <rect x="80" y="224" width="520" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="80" y="224" width="216" height="24" fill="#222"/>
  <text x="98" y="240.5" text-anchor="middle" fill="#fff">0</text>
  <line x1="116" y1="224" x2="116" y2="248" stroke="#fff" stroke-width="1.5"/>
  <text x="134" y="240.5" text-anchor="middle" fill="#fff">1</text>
  <line x1="152" y1="224" x2="152" y2="248" stroke="#fff" stroke-width="1.5"/>
  <text x="170" y="240.5" text-anchor="middle" fill="#fff">2</text>
  <line x1="188" y1="224" x2="188" y2="248" stroke="#fff" stroke-width="1.5"/>
  <text x="206" y="240.5" text-anchor="middle" fill="#fff">3</text>
  <line x1="224" y1="224" x2="224" y2="248" stroke="#fff" stroke-width="1.5"/>
  <text x="242" y="240.5" text-anchor="middle" fill="#fff">4</text>
  <line x1="260" y1="224" x2="260" y2="248" stroke="#fff" stroke-width="1.5"/>
  <text x="278" y="240.5" text-anchor="middle" fill="#fff">5</text>
  <text x="314" y="240.5" text-anchor="middle">0</text>
  <line x1="332" y1="224" x2="332" y2="248" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="240.5" text-anchor="middle">1</text>
  <line x1="368" y1="224" x2="368" y2="248" stroke="#222" stroke-width="1.5"/>
  <text x="386" y="240.5" text-anchor="middle">2</text>
  <line x1="404" y1="224" x2="404" y2="248" stroke="#222" stroke-width="1.5"/>
  <text x="422" y="240.5" text-anchor="middle">3</text>
  <line x1="440" y1="224" x2="440" y2="248" stroke="#222" stroke-width="1.5"/>
  <text x="458" y="240.5" text-anchor="middle">4</text>
  <line x1="476" y1="224" x2="476" y2="248" stroke="#222" stroke-width="1.5"/>
  <text x="494" y="240.5" text-anchor="middle">5</text>
  <line x1="512" y1="224" x2="512" y2="248" stroke="#222" stroke-width="1.5"/>
  <circle cx="80" cy="236" r="5" fill="#c33"/>
  <text x="70" y="240.5" text-anchor="end">seed</text>
  <path d="M 80 252 L 80 256 L 296 256 L 296 252" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="188" y="272" text-anchor="middle">batch 0: the seed's sequence</text>
  <path d="M 296 252 L 296 256 L 512 256 L 512 252" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="404" y="272" text-anchor="middle">batch 1</text>
  <!-- Bounded: a stride of the bound rounded up to odd, with the added draw
       in light grey, much wider than one draw is. -->
  <text x="80" y="296">bounded layout: G_random_init_layout_bounded()</text>
  <text x="80" y="312">stride: the bound rounded up to odd; light grey: the draw added to an even bound</text>
  <rect x="80" y="322" width="520" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="80" y="322" width="8" height="24" fill="#222"/>
  <rect x="116" y="323" width="4" height="22" fill="#ccc"/>
  <text x="106" y="338.5" text-anchor="middle">0</text>
  <line x1="120" y1="322" x2="120" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="120" y="322" width="13" height="24" fill="#222"/>
  <rect x="156" y="323" width="4" height="22" fill="#ccc"/>
  <text x="146" y="338.5" text-anchor="middle">1</text>
  <line x1="160" y1="322" x2="160" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="160" y="322" width="5" height="24" fill="#222"/>
  <rect x="196" y="323" width="4" height="22" fill="#ccc"/>
  <text x="186" y="338.5" text-anchor="middle">2</text>
  <line x1="200" y1="322" x2="200" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="200" y="322" width="16" height="24" fill="#222"/>
  <rect x="236" y="323" width="4" height="22" fill="#ccc"/>
  <text x="226" y="338.5" text-anchor="middle">3</text>
  <line x1="240" y1="322" x2="240" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="240" y="322" width="11" height="24" fill="#222"/>
  <rect x="276" y="323" width="4" height="22" fill="#ccc"/>
  <text x="266" y="338.5" text-anchor="middle">4</text>
  <line x1="280" y1="322" x2="280" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="280" y="322" width="7" height="24" fill="#222"/>
  <rect x="316" y="323" width="4" height="22" fill="#ccc"/>
  <text x="306" y="338.5" text-anchor="middle">5</text>
  <line x1="320" y1="322" x2="320" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="356" y="323" width="4" height="22" fill="#ccc"/>
  <text x="346" y="338.5" text-anchor="middle">0</text>
  <line x1="360" y1="322" x2="360" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="396" y="323" width="4" height="22" fill="#ccc"/>
  <text x="386" y="338.5" text-anchor="middle">1</text>
  <line x1="400" y1="322" x2="400" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="436" y="323" width="4" height="22" fill="#ccc"/>
  <text x="426" y="338.5" text-anchor="middle">2</text>
  <line x1="440" y1="322" x2="440" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="476" y="323" width="4" height="22" fill="#ccc"/>
  <text x="466" y="338.5" text-anchor="middle">3</text>
  <line x1="480" y1="322" x2="480" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="516" y="323" width="4" height="22" fill="#ccc"/>
  <text x="506" y="338.5" text-anchor="middle">4</text>
  <line x1="520" y1="322" x2="520" y2="346" stroke="#222" stroke-width="1.5"/>
  <rect x="556" y="323" width="4" height="22" fill="#ccc"/>
  <text x="546" y="338.5" text-anchor="middle">5</text>
  <line x1="560" y1="322" x2="560" y2="346" stroke="#222" stroke-width="1.5"/>
  <circle cx="80" cy="334" r="5" fill="#c33"/>
  <text x="70" y="338.5" text-anchor="end">seed</text>
  <path d="M 80 350 L 80 354 L 320 354 L 320 350" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="200" y="370" text-anchor="middle">batch 0</text>
  <path d="M 320 350 L 320 354 L 560 354 L 560 350" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="440" y="370" text-anchor="middle">batch 1</text>
  <text x="600" y="390" text-anchor="end">red dot: the seed; dashed line: the end of the span, 2^46 draws after the seed</text>
  <text x="600" y="408" text-anchor="end">dark: what the units of batch 0 draw</text>
</svg>
