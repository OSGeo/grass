  <title>The first two values of 64 consecutive seeds, which lie on lines, and of 64 batches of one layout, which scatter</title>
  <!-- Consecutive seeds: the value of seed 42 + k is that of seed 42 plus k
       times one amount, modulo 1, so the values lie on straight lines. -->
  <text x="80.0" y="22.0">seeds 42, 43, ... 105:</text>
  <text x="80.0" y="38.0">the values lie on lines</text>
  <!-- Batches of one layout: unit 0 of batches 0 to 63 of an exact layout of
       seed 42 with a million units of a million draws each. -->
  <text x="370.0" y="22.0">batches 0, 1, ... 63 of one layout:</text>
  <text x="370.0" y="38.0">the values scatter</text>
