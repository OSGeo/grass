---
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**/*.html'
      - '**/*.md'
      - '**/*.txt'
  schedule:
    # Check every Saturday at 18:36
    - cron: 36 18 * * 6

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - c-cpp
          - python

    concurrency:
      group: ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.head_ref || github.sha }}-${{ matrix.language }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - name: Install non-Python dependencies
        if: ${{ matrix.language == 'c-cpp' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget git gawk findutils
          xargs -a <(awk '! /^ *(#|$)/' ".github/workflows/apt.txt") -r -- \
              sudo apt-get install -y --no-install-recommends --no-install-suggests
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: ${{ matrix.language == 'c-cpp' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Create installation directory
        run: |
          mkdir "${HOME}/install"

      - name: Set LD_LIBRARY_PATH for compilation
        run: |
          echo "LD_LIBRARY_PATH=${HOME}/install/lib" >> "${GITHUB_ENV}"

      - name: Set number of cores for compilation
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"

      - name: Build
        if: ${{ matrix.language == 'c-cpp' }}
        env:
          CFLAGS: -std=gnu11
          CXXFLAGS: -std=c++11
        run: .github/workflows/build_ubuntu-22.04.sh "${HOME}/install"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
